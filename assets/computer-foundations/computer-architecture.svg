<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Computer architecture: the von Neumann model</title>
  <desc id="desc">Block diagram showing the CPU containing the control unit, arithmetic logic unit, and registers, connected by address, data, and control buses to main memory and input/output devices, with secondary storage shown outside the CPU-memory loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect width="860" height="520" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- CPU -->
  <rect x="48" y="60" width="300" height="300" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="198" y="92" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#0969da">CPU — Central Processing Unit</text>

  <rect x="78" y="120" width="240" height="66" rx="8" fill="#ffffff" stroke="#1f6feb"/>
  <text x="198" y="146" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937">Control Unit</text>
  <text x="198" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#57606a">directs the fetch–decode–execute cycle</text>

  <rect x="78" y="204" width="240" height="66" rx="8" fill="#ffffff" stroke="#1f6feb"/>
  <text x="198" y="230" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937">ALU — Arithmetic Logic Unit</text>
  <text x="198" y="252" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#57606a">addition, comparison, logical operations</text>

  <rect x="78" y="288" width="240" height="60" rx="8" fill="#ffffff" stroke="#1f6feb"/>
  <text x="198" y="313" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2937">Registers</text>
  <text x="198" y="335" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#57606a">tiny, extremely fast temporary storage</text>

  <!-- Main memory -->
  <rect x="560" y="60" width="252" height="180" rx="10" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
  <text x="686" y="92" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#1a7f37">Main Memory (RAM)</text>
  <text x="686" y="120" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1f2937">Holds instructions and data currently in use.</text>
  <text x="686" y="144" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1f2937">Contents vanish when power is removed.</text>
  <text x="686" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">Programs are loaded here before they run —</text>
  <text x="686" y="196" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">the same memory holds code and data.</text>

  <!-- Secondary storage -->
  <rect x="560" y="316" width="252" height="120" rx="10" fill="#fff8c5" fill-opacity="0.9" stroke="#9a6700" stroke-width="2"/>
  <text x="686" y="346" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#9a6700">Secondary Storage</text>
  <text x="686" y="372" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#1f2937">SSD / hard disk — keeps files when powered off</text>
  <text x="686" y="396" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">slower than RAM; data must be copied into</text>
  <text x="686" y="416" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">memory before the CPU can use it</text>

  <!-- I/O -->
  <rect x="48" y="416" width="300" height="66" rx="10" fill="#fbe9e9" stroke="#cf222e" stroke-width="2"/>
  <text x="198" y="442" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#a40e26">Input / Output Devices</text>
  <text x="198" y="466" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#57606a">keyboard, mouse, screen, network — the only way in and out</text>

  <!-- Buses -->
  <line x1="348" y1="150" x2="556" y2="150" stroke="#30363d" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="452" y="138" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#30363d">Data + control + address buses</text>

  <line x1="452" y1="170" x2="452" y2="392" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <text x="466" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#1f6feb">system bus</text>
  <text x="466" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#1f6feb">traffic</text>

  <line x1="348" y1="449" x2="440" y2="449" stroke="#30363d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="452" y1="416" x2="452" y2="449" stroke="#30363d" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="686" y1="240" x2="686" y2="312" stroke="#9a6700" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="698" y="282" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9a6700">copy to load</text>

  <text x="430" y="505" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">Everything a computer does is the CPU moving values between registers, memory, and devices over these paths.</text>
</svg>