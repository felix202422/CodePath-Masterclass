<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">The three areas of Git</title>
  <desc id="desc">Three panels left to right: the working tree holding files you edit, the index holding the staged snapshot, and the repository holding permanent commits. Arrows show git add moving edits into the index and git commit freezing the index into the repository. Below, a chain of pointers: HEAD points at the branch main, which points at the latest commit, which names its parent.</desc>
  <rect width="900" height="430" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <text x="30" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937">Git's three areas — add copies, commit freezes</text>
  <text x="30" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#57606a">Files move left to right; HEAD and the branch are pointers, not copies.</text>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <!-- panel 1: working tree -->
    <rect x="30" y="92" width="230" height="120" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="46" y="120" font-size="15.5" font-weight="700" fill="#0969da">Working tree</text>
    <text x="46" y="146" font-size="13" fill="#1f2937">the files you see and edit</text>
    <text x="46" y="170" font-size="13" fill="#1f2937">state: modified, untracked</text>
    <text x="46" y="194" font-size="12.5" fill="#57606a">"what is on disk right now"</text>

    <!-- panel 2: index -->
    <rect x="335" y="92" width="230" height="120" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="351" y="120" font-size="15.5" font-weight="700" fill="#0969da">Index (staging area)</text>
    <text x="351" y="146" font-size="13" fill="#1f2937">the exact next snapshot</text>
    <text x="351" y="170" font-size="13" fill="#1f2937">state: staged (added)</text>
    <text x="351" y="194" font-size="12.5" fill="#57606a">"what the commit will contain"</text>

    <!-- panel 3: repository -->
    <rect x="640" y="92" width="230" height="120" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="656" y="120" font-size="15.5" font-weight="700" fill="#1a7f37">Repository (.git)</text>
    <text x="656" y="146" font-size="13" fill="#1f2937">permanent snapshots</text>
    <text x="656" y="170" font-size="13" fill="#1f2937">state: committed</text>
    <text x="656" y="194" font-size="12.5" fill="#57606a">"history, addressable by hash"</text>

    <!-- arrows between panels -->
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#57606a"/>
      </marker>
      <marker id="arrowback" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
        <path d="M9,0 L0,4.5 L9,9 z" fill="#cf222e"/>
      </marker>
    </defs>
    <line x1="264" y1="132" x2="331" y2="132" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="268" y="122" font-size="13.5" font-weight="700" fill="#1f2937">git add</text>
    <line x1="569" y1="132" x2="636" y2="132" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="573" y="122" font-size="13.5" font-weight="700" fill="#1f2937">git commit</text>

    <!-- undo arrows below -->
    <line x1="636" y1="176" x2="573" y2="176" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowback)"/>
    <text x="566" y="232" font-size="12.5" fill="#cf222e">restore --staged: unstage, keep edits</text>
    <line x1="331" y1="176" x2="267" y2="176" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowback)"/>
    <text x="240" y="252" font-size="12.5" fill="#cf222e">restore file: discard edits, take index's copy</text>

    <!-- pointer chain -->
    <text x="30" y="300" font-size="14.5" font-weight="700" fill="#1f2937">And the pointers underneath:</text>
    <rect x="30" y="316" width="96" height="44" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="78" y="343" font-size="14" font-weight="700" text-anchor="middle" fill="#7d4e00">HEAD</text>

    <line x1="128" y1="338" x2="176" y2="338" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="152" y="330" font-size="11.5" text-anchor="middle" fill="#57606a">points at</text>

    <rect x="178" y="316" width="118" height="44" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
    <text x="237" y="336" font-size="13.5" font-weight="700" text-anchor="middle" fill="#7d4e00">branch: main</text>
    <text x="237" y="352" font-size="11" text-anchor="middle" fill="#57606a">a 41-byte file</text>

    <line x1="298" y1="338" x2="346" y2="338" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="322" y="330" font-size="11.5" text-anchor="middle" fill="#57606a">holds</text>

    <rect x="348" y="316" width="150" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="423" y="336" font-size="13" font-weight="700" text-anchor="middle" fill="#1a7f37">commit c316a70</text>
    <text x="423" y="352" font-size="11" text-anchor="middle" fill="#57606a">tree + parent + message</text>

    <line x1="500" y1="338" x2="548" y2="338" stroke="#57606a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="524" y="330" font-size="11.5" text-anchor="middle" fill="#57606a">parent</text>

    <rect x="550" y="316" width="150" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="625" y="336" font-size="13" font-weight="700" text-anchor="middle" fill="#1a7f37">commit 19c50b0</text>
    <text x="625" y="352" font-size="11" text-anchor="middle" fill="#57606a">… and so on</text>

    <text x="30" y="398" font-size="12.5" fill="#57606a">Amend or reset moves the branch pointer; the reflog records every move — which is why "lost" commits come back.</text>
    <text x="30" y="416" font-size="12.5" fill="#57606a">Detached HEAD = HEAD points at a commit directly, not at a branch — named work stops existing until you name it again.</text>
  </g>
</svg>
